# Project information
site_name: 'Webtechnologie 1'
site_description: 'Onderwijsmateriaal voor de module Webtechnologie HBO-ICT jaar 1 semester 2'
site_url: 'https://erikroos.github.io/webtech1/'
use_directory_urls: false

# Repository
repo_url: 'https://github.com/erikroos/webtech1'
repo_name: 'erikroos/webtech1'
edit_uri: 'edit/main/docs/'

theme:
  name: 'material'
  language: 'nl'
  icon:
    logo: 'material/library'
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: 'blue grey'
      accent: 'orange'
      toggle:
        icon: material/brightness-7
        name: Schakel naar donkere modus
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: 'blue grey'
      accent: 'orange'
      toggle:
        icon: material/brightness-4
        name: Schakel naar lichte modus
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view

extra_css:
  - css/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])'
      lang: nl
  - glightbox

copyright: |
  &copy; Hanzehogeschool Groningen -
  <a href="https://github.com/erikroos/webtech1/issues/new" target="_blank">Meld een probleem of onduidelijkheid</a>

